name: Assinaturas comerciais

# Expira reservas de vaga vencidas, avisa renovação anual e suspende quem venceu sem renovar, a cada 30 minutos.
# Menos urgente que os lembretes do calendário: um atraso só adia o aviso ou a expiração da reserva.
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   APP_URL      endereço do site em produção, sem barra final (ex.: https://seu-site.vercel.app)
#   CRON_SECRET  o mesmo valor definido como variável de ambiente CRON_SECRET na Vercel
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: assinaturas
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a rota de assinaturas comerciais
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os segredos APP_URL e CRON_SECRET no repositório." >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body --retry 2 --retry-delay 5 --max-time 90 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/assinaturas"
