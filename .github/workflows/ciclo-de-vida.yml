name: Ciclo de vida do cliente

# Dispara o processamento do ciclo de vida (avisos de fim do teste, campanhas de e-mail e fila de envio) a cada
# 15 minutos. O processamento é idempotente: um atraso do GitHub só adia o envio, e rodar duas vezes não duplica nada.
# Em repositório público, o GitHub desativa agendamentos após 60 dias sem atividade.
#
# Segredos do repositório (os mesmos de lembretes.yml):
#   APP_URL      endereço do site em produção, sem barra final (ex.: https://www.seudominio.com.br)
#   CRON_SECRET  o mesmo valor definido como variável de ambiente CRON_SECRET na Vercel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ciclo-de-vida
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a rota do ciclo de vida
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os segredos APP_URL e CRON_SECRET no repositório." >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body --retry 2 --retry-delay 5 --max-time 90 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/ciclo-de-vida"
