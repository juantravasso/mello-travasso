<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Elo Profissionais — vídeo para WhatsApp</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f2a4a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Geist", sans-serif; color: #f8fafc; }
      .fundo { position: absolute; inset: 0; background: radial-gradient(1100px 900px at 85% 0%, rgba(45, 212, 191, 0.22), transparent 60%), radial-gradient(900px 800px at 0% 100%, rgba(232, 176, 75, 0.14), transparent 60%), linear-gradient(180deg, #0f2a4a 0%, #0b1f38 100%); }
      .hl { color: #2dd4bf; }
      .head { position: absolute; left: 70px; right: 70px; top: 110px; height: 250px; display: flex; align-items: center; }
      .head h1 { font-size: 74px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
      #phone { position: absolute; left: 160px; top: 400px; width: 760px; height: 1645px; border-radius: 72px; overflow: hidden; background: #f5f6f8; box-shadow: 0 0 0 14px #08182b, 0 40px 120px rgba(0, 0, 0, 0.55); }
      .tela { position: absolute; left: 0; top: 0; width: 760px; height: 1646px; object-fit: cover; }
      .chip-wrap { position: absolute; left: 0; right: 0; top: 400px; height: 0; display: flex; justify-content: center; }
      .chip { margin-top: -46px; height: 92px; padding: 0 44px; border-radius: 46px; background: #e8b04b; color: #0f2a4a; font-size: 50px; font-weight: 700; display: flex; align-items: center; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); }
      .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 80px; }
      .center .inner { width: 100%; }
      .big { font-size: 96px; line-height: 1.08; font-weight: 750; letter-spacing: -0.03em; }
      .dores { list-style: none; margin-top: 70px; display: flex; flex-direction: column; gap: 26px; }
      .dores li { font-size: 50px; font-weight: 500; color: #e2e8f0; display: flex; align-items: center; gap: 22px; }
      .dores.x li::before { content: "✕"; width: 64px; height: 64px; flex: none; border-radius: 50%; background: rgba(248, 113, 113, 0.18); color: #f87171; font-size: 34px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .fim .inner { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .logo { width: 260px; height: 140px; display: block; }
      .produto { margin-top: 40px; font-size: 104px; font-weight: 750; letter-spacing: -0.03em; }
      .frase { margin-top: 26px; font-size: 52px; line-height: 1.25; color: #cbd5e1; max-width: 900px; }
      .botao { margin-top: 80px; padding: 34px 80px; border-radius: 999px; background: #2dd4bf; color: #0f2a4a; font-size: 58px; font-weight: 750; }
      /* Reels: a coluna de botões do Instagram cobre a borda direita; o texto fica fora dela. */
      .ig .center { padding: 0 170px 0 80px; }
      .ig .head { right: 170px; }
      .site { margin-top: 48px; font-size: 54px; font-weight: 600; color: #e8b04b; }
    </style>
  </head>
  <body>
    <div id="root" class="" data-composition-id="profissionais" data-start="0" data-width="1080" data-height="1920" data-duration="25">
      <div id="bg" class="clip fundo" data-start="0" data-duration="25" data-track-index="0"></div>
      <div id="phone" data-layout-allow-overflow>
        <video id="v0" class="clip tela" style="position: absolute; left: 0px; top: 0px; width: 760px; height: 1646px; object-fit: cover" src="assets/clips/p_busca1.mp4" muted playsinline data-start="3.5" data-duration="5.13-->" data-track-index="1"></video>
        <video id="v1" class="clip tela" style="position: absolute; left: 0px; top: 0px; width: 760px; height: 1646px; object-fit: cover" src="assets/clips/p_busca2.mp4" muted playsinline data-start="8.63" data-duration="6-->" data-track-index="1"></video>
        <video id="v2" class="clip tela" style="position: absolute; left: 0px; top: 0px; width: 760px; height: 1646px; object-fit: cover" src="assets/clips/p_meu.mp4" muted playsinline data-start="14.63" data-duration="1.9-->" data-track-index="1"></video>
        <video id="v3" class="clip tela" style="position: absolute; left: 0px; top: 0px; width: 760px; height: 1646px; object-fit: cover" src="assets/clips/p_perfil.mp4" muted playsinline data-start="16.53" data-duration="4.47-->" data-track-index="1"></video>
      </div>
      <div id="s0" class="clip center" data-start="0" data-duration="3.5" data-track-index="2"><div class="inner"><h1 class="big">Precisa de um <span class="hl">encanador de confiança</span>?</h1><ul class="dores "><li id="d0_0">Indicação nem sempre resolve</li></ul></div></div>
      <div id="h1" class="clip head" data-start="3.5" data-duration="5.13" data-track-index="2"><h1 class="inner">Busque por <span class="hl">profissão e cidade.</span></h1></div>
      <div id="h2" class="clip head" data-start="8.63" data-duration="6" data-track-index="2"><h1 class="inner">Veja a nota e <span class="hl">o que outros clientes disseram.</span></h1></div>
      <div id="h3" class="clip head" data-start="14.63" data-duration="6.37" data-track-index="2"><h1 class="inner">É profissional? <span class="hl">Crie seu perfil e seja encontrado.</span></h1></div>
      <div id="s4" class="clip center fim" data-start="21" data-duration="4" data-track-index="2"><div class="inner">
        <svg class="logo" viewBox="0 0 120 64" aria-hidden="true"><rect x="6" y="10" width="62" height="44" rx="22" fill="none" stroke="#2dd4bf" stroke-width="10"/><rect x="52" y="10" width="62" height="44" rx="22" fill="none" stroke="#e8b04b" stroke-width="10"/></svg>
        <p class="produto">Elo Profissionais</p>
        <p class="frase">Busque grátis ou crie seu perfil.</p>
        <p class="botao">Acesse agora</p>
        <p class="site">eloprofissionais.com.br</p>
      </div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      gsap.set("#phone", { opacity: 0, y: 160 });
      tl.fromTo("#phone", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.35);
      tl.to("#phone", { y: 160, opacity: 0, duration: 0.35, ease: "power2.in" }, 20.7);
      tl.fromTo("#s0 .big", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#d0_0", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.9);
      tl.to("#s0 .inner", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 3.2);
      tl.fromTo("#h1 .inner", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.55);
      tl.fromTo("#h2 .inner", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 8.68);
      tl.fromTo("#h3 .inner", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 14.68);
      tl.fromTo("#s4 .logo", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 21.1);
      tl.fromTo("#s4 .produto", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 21.28);
      tl.fromTo("#s4 .frase", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 21.46);
      tl.fromTo("#s4 .botao", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 21.64);
      tl.fromTo("#s4 .site", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 21.82);
      tl.fromTo("#s4 .botao", { scale: 1 }, { scale: 1.06, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, 22.3);
      window.__timelines["profissionais"] = tl;
    </script>
  </body>
</html>
